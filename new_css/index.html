  <style>
    :root{ --bg:#05070a; --txt:#e9eef6; --muted:#a2adbd; --line:rgba(255,255,255,.10); --blue:#2d6ae3; --violet:#7c3aed; --white:#000000; --maxw:940px;}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.65;overflow:hidden}
    a{color:inherit;text-decoration:none}
    /* scene */
    .scene{position:fixed;inset:0;z-index:0;overflow:hidden}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    /* brand */
    .brand{position:fixed;left:min(5vw,44px);top:min(4vh,34px);display:flex;align-items:center;gap:10px;font-weight:800;z-index:5}
    .dot{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 140deg, var(--blue), var(--white));box-shadow:0 0 0 6px rgba(124,58,237,.14)}
    /* left rail (desktop) */
    .rail{position:fixed;left:min(5vw,44px);top:50%;transform:translateY(-50%);display:grid;gap:16px;z-index:5}
    .rail a{display:inline-block;padding:6px 4px;border-bottom:1px solid transparent;color:#d7deec;font-weight:600}
    /* tooltip */
    .tt{position:relative}
    .tt:hover::after{content:attr(data-tooltip);position:absolute;left:110%;top:50%;transform:translateY(-50%);background:rgba(7,9,13,.95);border:1px solid var(--line);color:#dfe6f7;font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap}
    /* block */
    .block{position:fixed;right:min(5vw,44px);bottom:250px;z-index:4}
    .eyebrow{font:700 11px/1 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#b6bfd0}
    h1{font:800 clamp(28px,5.2vw,50px)/1.08 'DM Sans',Inter,sans-serif;margin:.5rem 0 0}
    .prose{margin-top:.6rem;color:#d0d7e6}.prose p{margin:.32rem 0;opacity:.92}.prose p small{color:#9fb0c9}
    /* hover underline */
    .rail a:hover,.prose a:hover,.drawer a:hover{text-decoration:underline}
    /* mobile hamburger */
    .hamb{position:fixed;left:16px;top:16px;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(10,13,18,.6);backdrop-filter:blur(8px);color:#e6ecfa;display:none;place-items:center;z-index:6}
    .hamb svg{width:20px;height:20px}
    .drawer{position:fixed;left:16px;top:64px;right:16px;border:1px solid var(--line);border-radius:14px;background:rgba(7,9,13,.95);backdrop-filter:blur(8px);padding:10px 14px;z-index:7}
    .drawer a{display:block;padding:12px 6px;color:#e6ecfa}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:6}
    [hidden]{display:none !important}
    /* hint & toast */
    .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#9aa6b8;font-size:12px;opacity:.9;z-index:3}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(8,11,16,.9);border:1px solid var(--line);color:#dfe6f7;padding:10px 14px;border-radius:10px;z-index:8;opacity:0;pointer-events:none;transition:opacity .2s ease}
    .toast.show{opacity:1}
    /* rise anim */
    .rise{opacity:0;transform:translateY(8px);animation:rise .9s ease forwards}
    .rise.d2{animation-delay:.08s}.rise.d3{animation-delay:.16s}.rise.d4{animation-delay:.24s}.rise.d5{animation-delay:.32s}.rise.d6{animation-delay:.40s}
    @keyframes rise{to{opacity:1;transform:none}}
    /* responsive */
    @media (max-width:720px){.rail{display:none}.hamb{display:grid}.brand{left:64px;top:22px;font-size:14px;gap:8px}.block{right:20px;left:20px;bottom:26px}.hint{bottom:10px}}
    @media (prefers-reduced-motion:reduce){canvas{display:none}
      body{background:radial-gradient(1200px 600px at 10% 0%, rgba(45,106,227,.16), transparent 60%),radial-gradient(900px 540px at 90% 20%, rgba(124,58,237,.12), transparent 60%), var(--bg)}
      .rise{animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>

  <script>
    // =================== AI "Neural Field" Background 2.1 (stable) ===================
    // 2D field + depth-based parallax (stable, performant)

    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W, H, nodes = [], lastT = 0, mouse={x:null,y:null,down:false};
    let cam = {x:0,y:0,t:0}; // parallax drift only

    const CFG = { baseNodes: 80, maxDist: 170, speed: 0.55, hueA: 224, hueB: 266, pulseEvery: 2200, separation: 34, jitter: 0.12, depthMin: 0.7, depthMax: 1.6 };

    function resize(){
      W = canvas.width = Math.floor(innerWidth * dpr);
      H = canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const area = innerWidth * innerHeight;
      const n = Math.max(50, Math.min(160, Math.round(CFG.baseNodes * (area / (1200*800)))));
      nodes = new Array(n).fill(0).map(()=>spawn());
    }

    function rnd(a=1){return Math.random()*a}
    function randRange(a,b){return a + Math.random()*(b-a)}

    function spawn(){ return { x: rnd(innerWidth), y: rnd(innerHeight), vx: rnd(1)-.5, vy: rnd(1)-.5, r: 1 + rnd(1.6), z: randRange(CFG.depthMin, CFG.depthMax), phase: rnd(Math.PI*2) } }

    function field(x,y,t){
      const s1 = 0.0009 + Math.sin(t*0.07)*0.0002;
      const s2 = 0.0013 + Math.cos(t*0.05)*0.00025;
      const a = Math.sin(x*s1 + t*0.6) + Math.cos(y*s1*1.2 - t*0.5);
      const b = Math.cos(x*s2 - t*0.4) - Math.sin(y*s2*1.1 + t*0.7);
      return [a, b];
    }

    let lastPulse = 0;
    function tick(ms){
      const t = ms/1000; const dt = lastT ? Math.min(0.05, t - lastT) : 0.016; lastT = t;
      cam.t += dt; cam.x = Math.sin(cam.t*0.08)*60; cam.y = Math.cos(cam.t*0.06)*40;
      ctx.clearRect(0,0,innerWidth,innerHeight);

      const grd = ctx.createRadialGradient(innerWidth*0.15, innerHeight*0.1, 0, innerWidth*0.5, innerHeight*0.7, Math.hypot(innerWidth,innerHeight)*0.9);
      grd.addColorStop(0, 'rgba(45,106,227,0.10)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd; ctx.fillRect(0,0,innerWidth,innerHeight);

      const maxD = CFG.maxDist; const sep = CFG.separation; const sep2 = sep*sep;
      const pulse = (ms - lastPulse) < 520; if(ms - lastPulse > CFG.pulseEvery) lastPulse = ms;

      for(let i=0;i<nodes.length;i++){
        const n = nodes[i];
        const [fx,fy] = field(n.x, n.y, t*CFG.speed + n.phase*0.2);
        n.vx += fx*0.05 + (Math.random()-0.5)*CFG.jitter;
        n.vy += fy*0.05 + (Math.random()-0.5)*CFG.jitter;
        for(let j=i+1;j<nodes.length;j++){
          const m = nodes[j]; const dx = n.x - m.x, dy = n.y - m.y; const d2 = dx*dx + dy*dy;
          if(d2 < sep2){ const d = Math.sqrt(d2) || 0.001; const f = (sep - d)/sep * 0.12; const ux = dx/d, uy = dy/d; n.vx += ux*f; n.vy += uy*f; m.vx -= ux*f; m.vy -= uy*f; }
        }
        if(mouse.x!=null){ const dx = n.x - mouse.x, dy = n.y - mouse.y, d = Math.hypot(dx,dy);
          if(d < 160){ const f = (mouse.down? -1:1) * (160-d)/160 * 0.9; n.vx += (dx/d||0)*f; n.vy += (dy/d||0)*f; }
        }
        n.vx *= 0.96; n.vy *= 0.96; n.x += n.vx; n.y += n.vy;
        if(n.x < -60) n.x = innerWidth+60; if(n.x > innerWidth+60) n.x = -60;
        if(n.y < -60) n.y = innerHeight+60; if(n.y > innerHeight+60) n.y = -60;
      }

      // draw links with parallax
      for(let i=0;i<nodes.length;i++){
        const a = nodes[i]; const ax = a.x - cam.x*a.z, ay = a.y - cam.y*a.z;
        ctx.beginPath(); ctx.fillStyle = 'rgba(220,235,255,.08)'; ctx.arc(ax,ay, a.r*3,0,Math.PI*2); ctx.fill();
        for(let j=i+1;j<nodes.length;j++){
          const b = nodes[j]; const bx = b.x - cam.x*b.z, by = b.y - cam.y*b.z; const dx = ax - bx, dy = ay - by; const d = Math.hypot(dx,dy);
          if(d < maxD){ const w = 1 - d/maxD; const hue = CFG.hueA*(1-w) + CFG.hueB*w; ctx.strokeStyle = `hsla(${hue}, 86%, 66%, ${w*0.7})`;
            if(pulse && (i%7===0 || j%11===0)) ctx.strokeStyle = `hsla(${hue}, 96%, 78%, ${w})`;
            ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); }
        }
      }
      for(const n of nodes){ const nx = n.x - cam.x*n.z, ny = n.y - cam.y*n.z; ctx.beginPath(); ctx.fillStyle = 'rgba(240,245,255,.75)'; ctx.arc(nx,ny, Math.max(1, n.r*n.z*0.9), 0, Math.PI*2); ctx.fill(); }
      requestAnimationFrame(tick);
    }

    function onMove(e){ if(e.touches && e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } else { mouse.x = e.clientX; mouse.y = e.clientY; } }
    function onLeave(){ mouse.x = mouse.y = null; }

    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerdown', e=>{mouse.down=true; onMove(e)});
    window.addEventListener('pointerup', ()=>mouse.down=false);
    window.addEventListener('pointerleave', onLeave);

    resize(); requestAnimationFrame(tick);

    // ============ hamburger + copy-to-clipboard ============
    const hamb=document.getElementById('hamb');
    const drawer=document.getElementById('drawer');
    const scrim=document.getElementById('scrim');
    const toast=document.getElementById('toast');

    function toggleMenu(open){ drawer.hidden=!open; scrim.hidden=!open; hamb.setAttribute('aria-expanded', String(open)); }
    hamb.addEventListener('click', ()=>toggleMenu(drawer.hidden));
    scrim.addEventListener('click', ()=>toggleMenu(false));
    drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=>toggleMenu(false)));

    function copyEmail(){
      const email='hanifi@hanificetinkaya.com'; 
      const show=(ok)=>{ toast.textContent= ok?'Copied to clipboard':('Copy failed — '+email); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500); };
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(email).then(()=>show(true)).catch(()=>{fallback(email); show(false);}); }
      else { fallback(email); show(true); }
    }
    function fallback(text){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand('copy');}catch{} ta.remove(); }
    document.querySelectorAll('[data-copy-email]').forEach(el=>{ el.addEventListener('click', e=>{ e.preventDefault(); copyEmail(); }); el.setAttribute('title','Copy email to clipboard'); });
  </script>
