<div class="border-bottom row" style="margin-bottom:16px; padding-bottom:4px;">
  <div class="col-10">  <h4 style="color:rgb(120,120,120); margin-bottom:8px;">
      {{ project["project_name"] }}
    </h4>
    {% if "content" in project %}
    <div>
      <b>Project Content:</b> {{ project["content"] }}
    </div>
    {% endif %}
    {% if "languages" in project %}
    <div>
      <b>Languages:</b> {{ project["languages"] }}
    </div>
    {% endif %}
  </div>  <div class="col-2" style="padding-right:16px;">
    <a href="{{ project['link'] }}" type="button" class="btn btn-outline-primary float-right align-middle" target="_blank">Look Inside</a>

    <form action="/project/{{ project['id'] }}/delete" method="POST" style="display:inline;">
    </form>
    </div>
</div>
